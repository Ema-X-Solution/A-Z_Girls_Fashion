server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.azs.business;
    ssl_certificate /etc/letsencrypt/live/azs.business/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azs.business/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://azs.business$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name azs.business;
    root /srv/az-fashion/apps/web/dist;
    index index.html;
    client_max_body_size 2m;
    ssl_certificate /etc/letsencrypt/live/azs.business/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azs.business/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 80;
    listen [::]:80;
    server_name azs.business www.azs.business;
    return 301 https://$host$request_uri;
}
