services:
  api:
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to the HTTPS origin}
  web:
    ports: !override ["80:80", "443:443"]
    volumes:
      - ./infrastructure/nginx/tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_DIRECTORY:?Set TLS_DIRECTORY}:/etc/nginx/tls:ro
